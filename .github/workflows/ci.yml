name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Версия должна быть не ниже указанной в go.mod, иначе Go
          # переключает toolchain на лету и теряет вспомогательные
          # инструменты — отсюда «no such tool covdata».
          go-version: "1.26"
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -race -count=1

      - name: Integration tests
        run: go test -tags=integration ./... -race -count=1 -coverprofile=coverage.out

      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # Экшен v8 работает с golangci-lint второй мажорной версии —
      # именно её формат использует .golangci.yml. Версия зафиксирована:
      # с latest сборка может внезапно упасть после обновления линтера.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2